# ============================================================
# docker-compose.yml — DEVELOPMENT ENVIRONMENT
# ============================================================
# This file is for running the stack locally / in development.
#
# TO DEPLOY TO PRODUCTION (VPS):
#   See docker-compose.prod.yml on the VPS.
#   Required steps before bringing production up:
#
#   1. Build the frontend image with the right API URL:
#      docker build \
#        --build-arg NEXT_PUBLIC_API_URL=https://www.vigil.green \
#        -t web-gis-frontend:latest \
#        ./frontend
#
#   2. Build the backend image (if the backend changed):
#      docker build -t web-gis-backend:latest ./backend
#
#   3. Restart the services:
#      docker compose -f docker-compose.prod.yml down
#      docker compose -f docker-compose.prod.yml up -d
#
# IMPORTANT — NEXT_PUBLIC_* VARIABLES:
#   Next.js embeds NEXT_PUBLIC_* variables into the JS bundle
#   at BUILD TIME (not at runtime). Therefore:
#   - RIGHT: pass them via build.args (docker-compose) or --build-arg (docker build)
#   - WRONG: pass them via environment: (runtime only, Next.js ignores it)
# ============================================================

services:
  # Database Service (PostgreSQL with PostGIS for spatial data)
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gialai_forest
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gialai_forest"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Connect to the db service
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/gialai_forest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploaded images
      - backend_uploads:/app/uploads

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars MUST be passed via build.args (build time).
        # Passing them via environment: has NO effect on Next.js.
        # DEV  → http://localhost:8000
        # PROD → https://www.vigil.green (pass with --build-arg to docker build)
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
